<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Offline Learning, as a journal-style schematic. (a) Trial sequence: a choice (A), a win (+), then an inter-trial
       interval (ITI) before the next choice. After a short wait people tend to stay with A; after a long one they more
       often shift to B, as if the wait were a cost charged back to A (the dashed arrow). (b) The schematic result: the
       chance of shifting after a win rises with the interval (no data values implied) -->
  <defs>
    <marker id="ol-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#9AA3B2" />
    </marker>
    <marker id="ol-brown" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#7E6148" />
    </marker>
  </defs>
  <rect width="320" height="240" rx="10" fill="#ffffff" />

  <!-- a: trial sequence -->
  <text x="12" y="21" font-size="14" font-weight="700" fill="#1f2430">a</text>
  <text x="26" y="21" font-size="11.5" font-weight="600" fill="#333a47">Trial sequence</text>
  <g font-size="10" fill="#555d6b">
    <text x="12" y="47">Short</text><text x="12" y="59">ITI</text>
    <text x="12" y="105">Long</text><text x="12" y="117">ITI</text>
  </g>
  <!-- short interval: stay -->
  <rect x="58" y="42" width="22" height="20" rx="4" fill="#3C5488" />
  <text x="69" y="56" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <path d="M82 52 H92" stroke="#9AA3B2" stroke-width="1.2" />
  <circle cx="103" cy="52" r="10" fill="#00A087" />
  <text x="103" y="56.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  <rect x="118" y="48" width="34" height="8" rx="4" fill="#E6EAF0" />
  <rect x="118" y="48" width="0" height="8" rx="4" fill="#9FB0C8">
    <animate attributeName="width" values="0;34;34" keyTimes="0;0.8;1" dur="1.6s" repeatCount="indefinite" />
  </rect>
  <rect x="160" y="42" width="22" height="20" rx="4" fill="#3C5488" />
  <text x="171" y="56" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="188" y="55.5" font-size="10" font-weight="600" fill="#3C5488">stay</text>
  <!-- long interval: shift -->
  <rect x="58" y="100" width="22" height="20" rx="4" fill="#3C5488" />
  <text x="69" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <path d="M82 110 H92" stroke="#9AA3B2" stroke-width="1.2" />
  <circle cx="103" cy="110" r="10" fill="#00A087" />
  <text x="103" y="114.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  <rect x="118" y="106" width="118" height="8" rx="4" fill="#E6EAF0" />
  <rect x="118" y="106" width="0" height="8" rx="4" fill="#9FB0C8">
    <animate attributeName="width" values="0;118;118" keyTimes="0;0.85;1" dur="4.6s" repeatCount="indefinite" />
  </rect>
  <rect x="244" y="100" width="22" height="20" rx="4" fill="#E64B35" />
  <text x="255" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="272" y="113.5" font-size="10" font-weight="600" fill="#E64B35">shift</text>
  <!-- the wait, charged back to the choice -->
  <g transform="translate(177 87)">
    <circle r="6.5" fill="#ffffff" stroke="#7E6148" stroke-width="1.3" />
    <path d="M0 -3.8 V0 L2.8 1.6" fill="none" stroke="#7E6148" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <text x="188" y="90.5" font-size="9.5" font-style="italic" fill="#7E6148">wait as a cost</text>
  <path d="M169 85 C140 74 92 74 72 97" fill="none" stroke="#7E6148" stroke-width="1.4" stroke-dasharray="3.5 2.5" marker-end="url(#ol-brown)">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <path d="M58 136 H284" stroke="#9AA3B2" stroke-width="1.2" marker-end="url(#ol-grey)" />
  <text x="290" y="139.5" font-size="9.5" fill="#7a8291">time</text>

  <!-- b: the schematic result -->
  <text x="12" y="160" font-size="14" font-weight="700" fill="#1f2430">b</text>
  <text x="26" y="160" font-size="11.5" font-weight="600" fill="#333a47">Shifting after a win</text>
  <path d="M64 170 V214 H300" fill="none" stroke="#555d6b" stroke-width="1.1" />
  <text transform="translate(52 192) rotate(-90)" font-size="9.5" fill="#555d6b" text-anchor="middle">P(shift | win)</text>
  <g font-size="9.5" fill="#555d6b" text-anchor="middle">
    <text x="92" y="227">short</text>
    <text x="182" y="227">inter-trial interval</text>
    <text x="274" y="227">long</text>
  </g>
  <path d="M92 200 L152 191 L212 178 L272 164 L272 184 L212 194 L152 205 L92 211 Z" fill="#F39B7F" fill-opacity="0.3" />
  <polyline points="92,206 152,198 212,186 272,174" fill="none" stroke="#E64B35" stroke-width="2" stroke-linejoin="round" stroke-dasharray="184" stroke-dashoffset="184">
    <animate attributeName="stroke-dashoffset" values="184;0" dur="1.6s" begin="0.3s" fill="freeze" />
  </polyline>
  <g fill="#E64B35" stroke="#ffffff" stroke-width="1.2">
    <circle cx="92" cy="206" r="3.6" />
    <circle cx="152" cy="198" r="3.6" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="0.8s" fill="freeze" /></circle>
    <circle cx="212" cy="186" r="3.6" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="1.35s" fill="freeze" /></circle>
    <circle cx="272" cy="174" r="3.6" opacity="0"><animate attributeName="opacity" to="1" dur="0.2s" begin="1.9s" fill="freeze" /></circle>
  </g>
</svg>
