<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Task (Mis)construal, as a journal-style schematic. (a) The task: a grid world with four obstacles, a start (S) and a
       goal (star). (b) An efficient construal keeps only the obstacle in the way (the wall) and leaves out the rest
       (dashed); the plan goes round the wall. (c) A misconstrual, as in anxiety, keeps every obstacle and treats the
       irrelevant ones as threats (red outlines): the same plan, made with hesitation, at a higher cost. (d) The value of
       a representation: how well its plan does, less what it costs to represent (schematic bars, no data implied) -->
  <defs>
    <marker id="tm-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#9AA3B2" />
    </marker>
    <path id="tm-star" d="M0 -1 L0.245 -0.338 L0.951 -0.309 L0.397 0.129 L0.588 0.809 L0 0.418 L-0.588 0.809 L-0.397 0.129 L-0.951 -0.309 L-0.245 -0.338 Z" />
    <!-- an empty five-by-five grid of 15-unit cells -->
    <g id="tm-grid">
      <rect width="75" height="75" rx="3" fill="#F7F9FC" stroke="#C9D1DD" stroke-width="1" />
      <path d="M15 0 V75 M30 0 V75 M45 0 V75 M60 0 V75 M0 15 H75 M0 30 H75 M0 45 H75 M0 60 H75" stroke="#E3E8EF" stroke-width="0.8" />
    </g>
  </defs>
  <rect width="320" height="240" rx="10" fill="#ffffff" />

  <!-- panel titles -->
  <g font-size="14" font-weight="700" fill="#1f2430">
    <text x="16" y="34">a</text><text x="122" y="34">b</text><text x="228" y="34">c</text>
  </g>
  <g font-size="11.5" font-weight="600" fill="#333a47">
    <text x="29" y="34">Task</text><text x="135" y="34">Construal</text><text x="241" y="34">Misconstrual</text>
  </g>
  <path d="M96 81.5 H117" stroke="#9AA3B2" stroke-width="1.3" marker-end="url(#tm-grey)" />
  <path d="M202 81.5 H223" stroke="#9AA3B2" stroke-width="1.3" marker-end="url(#tm-grey)" />

  <!-- a: the task, every obstacle -->
  <g transform="translate(16 44)">
    <use href="#tm-grid" />
    <rect x="16" y="31" width="58" height="13" rx="2" fill="#4DBBD5" />
    <rect x="46" y="61" width="28" height="13" rx="2" fill="#00A087" />
    <rect x="31" y="46" width="13" height="13" rx="2" fill="#8491B4" />
    <rect x="16" y="61" width="13" height="13" rx="2" fill="#F39B7F" />
    <circle cx="7.5" cy="67.5" r="4.5" fill="#3C5488" />
    <use href="#tm-star" transform="translate(67.5 8) scale(6)" fill="#F2B134" stroke="#C98A12" stroke-width="0.12" />
  </g>

  <!-- b: efficient construal -->
  <g transform="translate(122 44)">
    <use href="#tm-grid" />
    <rect x="16" y="31" width="58" height="13" rx="2" fill="#4DBBD5" />
    <g fill="none" stroke="#B9C2D0" stroke-width="1" stroke-dasharray="2.2 1.8">
      <rect x="46.5" y="61.5" width="27" height="12" rx="2" />
      <rect x="31.5" y="46.5" width="12" height="12" rx="2" />
      <rect x="16.5" y="61.5" width="12" height="12" rx="2" />
    </g>
    <path d="M7.5 67.5 V22.5 H67.5 V7.5" fill="none" stroke="#3C5488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="7.5" cy="67.5" r="4.5" fill="#3C5488" />
    <use href="#tm-star" transform="translate(67.5 8) scale(6)" fill="#F2B134" stroke="#C98A12" stroke-width="0.12" />
    <circle r="3.2" fill="#ffffff" stroke="#1f2430" stroke-width="1.5">
      <animateMotion path="M7.5 67.5 V22.5 H67.5 V7.5" keyPoints="0;1;1" keyTimes="0;0.75;1" calcMode="linear" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- c: misconstrual: everything kept, the irrelevant obstacles as threats -->
  <g transform="translate(228 44)">
    <use href="#tm-grid" />
    <rect x="16" y="31" width="58" height="13" rx="2" fill="#4DBBD5" />
    <g stroke="#E64B35" stroke-width="1.6">
      <rect x="46" y="61" width="28" height="13" rx="2" fill="#00A087" />
      <rect x="31" y="46" width="13" height="13" rx="2" fill="#8491B4" />
      <rect x="16" y="61" width="13" height="13" rx="2" fill="#F39B7F" />
    </g>
    <g font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="60" y="71">!</text><text x="37.5" y="56">!</text><text x="22.5" y="71">!</text>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </g>
    <path d="M7.5 67.5 V22.5 H67.5 V7.5" fill="none" stroke="#3C5488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="7.5" cy="67.5" r="4.5" fill="#3C5488" />
    <use href="#tm-star" transform="translate(67.5 8) scale(6)" fill="#F2B134" stroke="#C98A12" stroke-width="0.12" />
    <!-- the same plan, stopping to re-check -->
    <circle r="3.2" fill="#ffffff" stroke="#1f2430" stroke-width="1.5">
      <animateMotion path="M7.5 67.5 V22.5 H67.5 V7.5" keyPoints="0;0.2;0.2;0.375;0.375;0.7;0.7;1;1" keyTimes="0;0.12;0.27;0.37;0.55;0.68;0.8;0.9;1" calcMode="linear" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- d: the value of a representation -->
  <text x="16" y="146" font-size="14" font-weight="700" fill="#1f2430">d</text>
  <text x="160" y="146" font-size="12.5" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#1f2430" text-anchor="middle">VOR(c) = U(π<tspan font-size="9" dy="3">c</tspan><tspan dy="-3">) − C(c)</tspan></text>
  <path d="M92 214 H232" stroke="#555d6b" stroke-width="1.1" />
  <g>
    <rect x="114" y="214" width="13" height="0" fill="#00A087">
      <animate attributeName="height" to="40" dur="0.8s" begin="0.2s" fill="freeze" />
      <animate attributeName="y" to="174" dur="0.8s" begin="0.2s" fill="freeze" />
    </rect>
    <rect x="129" y="214" width="13" height="0" fill="#E64B35">
      <animate attributeName="height" to="12" dur="0.8s" begin="0.2s" fill="freeze" />
      <animate attributeName="y" to="202" dur="0.8s" begin="0.2s" fill="freeze" />
    </rect>
    <rect x="182" y="214" width="13" height="0" fill="#00A087">
      <animate attributeName="height" to="40" dur="0.8s" begin="0.5s" fill="freeze" />
      <animate attributeName="y" to="174" dur="0.8s" begin="0.5s" fill="freeze" />
    </rect>
    <rect x="197" y="214" width="13" height="0" fill="#E64B35">
      <animate attributeName="height" to="32" dur="0.8s" begin="0.5s" fill="freeze" />
      <animate attributeName="y" to="182" dur="0.8s" begin="0.5s" fill="freeze" />
    </rect>
  </g>
  <g font-size="9.5" fill="#555d6b" text-anchor="middle">
    <text x="128" y="227">construal</text>
    <text x="196" y="227">misconstrual</text>
  </g>
  <g font-size="10" fill="#333a47">
    <rect x="246" y="174" width="9" height="9" rx="1.5" fill="#00A087" />
    <text x="260" y="182">utility U</text>
    <rect x="246" y="192" width="9" height="9" rx="1.5" fill="#E64B35" />
    <text x="260" y="200">cost C</text>
  </g>
</svg>
