<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Task (Mis)construal: a grid world seen through the frame of a construal (the gold corners). The obstacles kept in
       it are solid; those left out are dashed. The plan from the dot to the star goes round the wall it kept, but runs
       into an obstacle it left out (the burst): a misconstrual. The dashed obstacle at the bottom right was rightly left
       out, as it is not in the way -->
  <defs>
    <radialGradient id="tm-bg" cx="45%" cy="35%" r="72%">
      <stop offset="0" stop-color="#11707a" />
      <stop offset=".55" stop-color="#0d3d55" />
      <stop offset="1" stop-color="#081a2e" />
    </radialGradient>
    <linearGradient id="tm-ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset=".5" stop-color="#5cc2ff" />
      <stop offset="1" stop-color="#ff7a7a" />
    </linearGradient>
    <linearGradient id="tm-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c39bff" />
      <stop offset="1" stop-color="#6f5cff" />
    </linearGradient>
    <linearGradient id="tm-block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0ff" />
      <stop offset="1" stop-color="#1e90ff" />
    </linearGradient>
    <linearGradient id="tm-path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3cf08c" />
      <stop offset="1" stop-color="#ffe17a" />
    </linearGradient>
    <linearGradient id="tm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8" />
      <stop offset="1" stop-color="#ffab2e" />
    </linearGradient>
    <pattern id="tm-ghost" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V5" stroke="#ff9a9a" stroke-opacity=".35" stroke-width="1.6" />
    </pattern>
    <filter id="tm-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <path id="tm-star" d="M0 -11 L2.7 -3.72 L10.46 -3.4 L4.37 1.42 L6.47 8.9 L0 4.6 L-6.47 8.9 L-4.37 1.42 L-10.46 -3.4 L-2.7 -3.72 Z" />
    <path id="tm-spark" d="M0 -5 C0.6 -1 1 -0.6 5 0 C1 0.6 0.6 1 0 5 C-0.6 1 -1 0.6 -5 0 C-1 -0.6 -0.6 -1 0 -5 Z" />
  </defs>

  <circle cx="100" cy="100" r="97" fill="url(#tm-bg)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#tm-ring)" stroke-width="5" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1" />

  <!-- The grid world: five by five cells of 22, from (45, 45) -->
  <rect x="45" y="45" width="110" height="110" rx="6" fill="#ffffff" fill-opacity=".05" />
  <path d="M67 45 V155 M89 45 V155 M111 45 V155 M133 45 V155 M45 67 H155 M45 89 H155 M45 111 H155 M45 133 H155" stroke="#ffffff" stroke-opacity=".2" stroke-width="1" />
  <rect x="45" y="45" width="110" height="110" rx="6" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.4" />

  <!-- Kept in the construal: the wall across the middle, and a block -->
  <g stroke="#ffffff" stroke-opacity=".8" stroke-width="1.4">
    <rect x="69" y="91" width="84" height="18" rx="4" fill="url(#tm-wall)" />
    <rect x="113" y="135" width="18" height="18" rx="4" fill="url(#tm-block)" />
  </g>
  <path d="M73 94 H96" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" />
  <!-- Left out: dashed. The one in the way (hatched coral), and the one rightly left out -->
  <rect x="91" y="47" width="18" height="40" rx="4" fill="url(#tm-ghost)" stroke="#ff9a9a" stroke-width="1.6" stroke-dasharray="4 3" />
  <rect x="135" y="135" width="18" height="18" rx="4" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 3" />

  <!-- The plan: up the left side, round the wall it kept, along the top toward the star -->
  <path d="M56 144 V78 H88" fill="none" stroke="url(#tm-path)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#tm-glow)" />
  <path d="M110 78 H144 V58" fill="none" stroke="#ffe17a" stroke-opacity=".6" stroke-width="2.2" stroke-dasharray="2 4" stroke-linecap="round" />
  <!-- where it runs into the obstacle it left out -->
  <g transform="translate(92 78)" filter="url(#tm-glow)">
    <path d="M0 -10 L2.4 -3.6 L9 -5 L4.4 0 L9 5 L2.4 3.6 L0 10 L-2.4 3.6 L-9 5 L-4.4 0 L-9 -5 L-2.4 -3.6 Z" fill="#ff7a7a" stroke="#ffe0e0" stroke-width="1">
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="1.6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- The start, and the goal -->
  <circle cx="56" cy="144" r="7" fill="#ffffff" stroke="#3cf08c" stroke-width="3" />
  <use href="#tm-star" transform="translate(144 57)" fill="url(#tm-gold)" stroke="#fff4c2" stroke-width="1" filter="url(#tm-glow)" />

  <!-- The construal's frame -->
  <g fill="none" stroke="#ffc94d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37 52 V37 H52" />
    <path d="M148 37 H163 V52" />
    <path d="M163 148 V163 H148" />
    <path d="M52 163 H37 V148" />
  </g>

  <use href="#tm-spark" transform="translate(172 100) scale(.7)" fill="#ffe17a" />
  <use href="#tm-spark" transform="translate(28 100) scale(.6)" fill="#7fe0ff" />
  <use href="#tm-spark" transform="translate(100 176) scale(.55)" fill="#ff9a9a" />
</svg>
