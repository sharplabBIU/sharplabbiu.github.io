<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Planning Efficiency, as a journal-style schematic. (a) When to plan: moving down a decision tree from the start (S)
       to the goal (star), planning is spent only at the choice that decides whether the goal is reached (red), and
       deferred where it does not (dashed); below, planning effort at each step. (b) Which direction: planning can run
       forward from the start (blue) or backward from the goal (red), meeting in the middle (green) -->
  <defs>
    <marker id="pe-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#4DBBD5" />
    </marker>
    <marker id="pe-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#E64B35" />
    </marker>
    <marker id="pe-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#9AA3B2" />
    </marker>
    <path id="pe-star" d="M0 -1 L0.245 -0.338 L0.951 -0.309 L0.397 0.129 L0.588 0.809 L0 0.418 L-0.588 0.809 L-0.397 0.129 L-0.951 -0.309 L-0.245 -0.338 Z" />
  </defs>
  <rect width="320" height="240" rx="10" fill="#ffffff" />
  <path d="M160 32 V226" stroke="#E6EAF0" stroke-width="1" />

  <!-- a: when to plan -->
  <text x="12" y="21" font-size="14" font-weight="700" fill="#1f2430">a</text>
  <text x="26" y="21" font-size="11.5" font-weight="600" fill="#333a47">When to plan</text>
  <g stroke="#C3CAD6" stroke-width="1.6" stroke-linecap="round">
    <path d="M80 46 L46 86 M46 86 L30 124 M46 86 L62 124 M114 86 L130 124" />
  </g>
  <path d="M80 46 L114 86 L98 124" fill="none" stroke="#3C5488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="114" cy="86" r="10" fill="none" stroke="#E64B35" stroke-width="1.6" opacity="0">
    <animate attributeName="r" values="10;10;19;19" keyTimes="0;0.3;0.56;1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.3;0.56;1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="46" cy="86" r="10" fill="#ffffff" stroke="#8491B4" stroke-width="1.6" stroke-dasharray="3 2.2" />
  <circle cx="114" cy="86" r="10" fill="#E64B35" />
  <g fill="#F1F3F7" stroke="#C3CAD6" stroke-width="1.4">
    <circle cx="30" cy="124" r="7" /><circle cx="62" cy="124" r="7" /><circle cx="130" cy="124" r="7" />
  </g>
  <use href="#pe-star" transform="translate(98 124.5) scale(9)" fill="#F2B134" stroke="#C98A12" stroke-width="0.09" />
  <circle cx="80" cy="46" r="10" fill="#3C5488" />
  <text x="80" y="49.8" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <!-- the agent, pausing at the choice where it plans -->
  <circle r="4" fill="#ffffff" stroke="#1f2430" stroke-width="1.8">
    <animateMotion path="M80 46 L114 86 L98 124" keyPoints="0;0.545;0.545;1;1" keyTimes="0;0.3;0.56;0.8;1" calcMode="linear" dur="4s" repeatCount="indefinite" />
  </circle>
  <!-- planning effort at each step -->
  <text x="22" y="150" font-size="10" fill="#555d6b">Planning effort</text>
  <rect x="39" y="176" width="14" height="6" rx="1.5" fill="#C3CAD6" />
  <rect x="73" y="156" width="14" height="26" rx="1.5" fill="#E64B35" />
  <rect x="107" y="176" width="14" height="6" rx="1.5" fill="#C3CAD6" />
  <path d="M26 182 H132" stroke="#9AA3B2" stroke-width="1.2" marker-end="url(#pe-grey)" />
  <g font-size="9.5" fill="#7a8291" text-anchor="middle">
    <text x="46" y="194">1</text><text x="80" y="194">2</text><text x="114" y="194">3</text>
  </g>
  <text x="136" y="185.5" font-size="9.5" fill="#7a8291">step</text>
  <!-- key -->
  <g font-size="10" fill="#333a47">
    <circle cx="24" cy="212" r="5" fill="#E64B35" />
    <text x="33" y="215.5">plan</text>
    <circle cx="70" cy="212" r="5" fill="#ffffff" stroke="#8491B4" stroke-width="1.4" stroke-dasharray="2.4 1.8" />
    <text x="79" y="215.5">defer</text>
    <use href="#pe-star" transform="translate(119 212.5) scale(6)" fill="#F2B134" stroke="#C98A12" stroke-width="0.12" />
    <text x="128" y="215.5">goal</text>
  </g>

  <!-- b: which direction -->
  <text x="170" y="21" font-size="14" font-weight="700" fill="#1f2430">b</text>
  <text x="184" y="21" font-size="11.5" font-weight="600" fill="#333a47">Which direction</text>
  <g stroke="#D3D8E1" stroke-width="1.4">
    <path d="M182 104 L212 68 M182 104 L212 140 M212 68 L242 104 M212 140 L242 104 M242 104 L272 68 M242 104 L272 140 M272 68 L302 104 M272 140 L302 104 M212 68 H272 M212 140 H272" />
  </g>
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M188.4 96.3 L205 76.4" stroke="#4DBBD5" marker-end="url(#pe-blue)" />
    <path d="M218.4 75.7 L235 95.6" stroke="#4DBBD5" marker-end="url(#pe-blue)" />
    <path d="M295.6 111.7 L279 131.6" stroke="#E64B35" marker-end="url(#pe-red)" />
    <path d="M265.6 132.3 L249 112.4" stroke="#E64B35" marker-end="url(#pe-red)" />
  </g>
  <circle cx="242" cy="104" r="10" fill="none" stroke="#00A087" stroke-width="1.6" opacity="0">
    <animate attributeName="r" values="10;10;20;20" keyTimes="0;0.6;0.9;1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.6;0.9;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <g fill="#F1F3F7" stroke="#C3CAD6" stroke-width="1.4">
    <circle cx="212" cy="68" r="8" /><circle cx="212" cy="140" r="8" /><circle cx="272" cy="68" r="8" /><circle cx="272" cy="140" r="8" />
  </g>
  <circle cx="242" cy="104" r="10" fill="#00A087" />
  <circle cx="182" cy="104" r="10" fill="#3C5488" />
  <text x="182" y="107.8" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <use href="#pe-star" transform="translate(302 104.5) scale(11)" fill="#F2B134" stroke="#C98A12" stroke-width="0.08" />
  <!-- the two predictions, arriving together -->
  <circle r="3.6" fill="#4DBBD5" stroke="#ffffff" stroke-width="1.4">
    <animateMotion path="M182 104 L212 68 L242 104" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle r="3.6" fill="#E64B35" stroke="#ffffff" stroke-width="1.4">
    <animateMotion path="M302 104 L272 140 L242 104" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear" dur="3s" repeatCount="indefinite" />
  </circle>
  <!-- key -->
  <g font-size="10" fill="#333a47">
    <path d="M178 178 H200" stroke="#4DBBD5" stroke-width="2.4" marker-end="url(#pe-blue)" />
    <text x="208" y="181.5">forward, from S</text>
    <path d="M200 196 H178" stroke="#E64B35" stroke-width="2.4" marker-end="url(#pe-red)" />
    <text x="208" y="199.5">backward, from goal</text>
    <circle cx="189" cy="213" r="5" fill="#00A087" />
    <text x="208" y="216.5">where they meet</text>
  </g>
</svg>
