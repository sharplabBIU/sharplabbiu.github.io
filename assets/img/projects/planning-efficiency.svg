<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Planning Efficiency: a clock face (when to plan) around a decision tree. The plan runs forward from where one is
       (blue) and backward from the goal (coral), meeting in the middle (green); planning waits at the dashed choice
       (paused), and the hourglass marks the time it saves -->
  <defs>
    <radialGradient id="pe-bg" cx="50%" cy="38%" r="68%">
      <stop offset="0" stop-color="#34449e" />
      <stop offset=".55" stop-color="#1c2266" />
      <stop offset="1" stop-color="#0d1036" />
    </radialGradient>
    <linearGradient id="pe-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc2ff" />
      <stop offset=".5" stop-color="#3cf08c" />
      <stop offset="1" stop-color="#ffc94d" />
    </linearGradient>
    <linearGradient id="pe-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8" />
      <stop offset="1" stop-color="#ffab2e" />
    </linearGradient>
    <radialGradient id="pe-sweep" cx="100" cy="100" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cc2ff" stop-opacity="0" />
      <stop offset="1" stop-color="#5cc2ff" stop-opacity=".38" />
    </radialGradient>
    <filter id="pe-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="pe-fwd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#bfe8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="pe-bwd" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffd0d0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <path id="pe-star" d="M0 -11 L2.7 -3.72 L10.46 -3.4 L4.37 1.42 L6.47 8.9 L0 4.6 L-6.47 8.9 L-4.37 1.42 L-10.46 -3.4 L-2.7 -3.72 Z" />
    <path id="pe-spark" d="M0 -5 C0.6 -1 1 -0.6 5 0 C1 0.6 0.6 1 0 5 C-0.6 1 -1 0.6 -5 0 C-1 -0.6 -0.6 -1 0 -5 Z" />
  </defs>

  <!-- Badge and clock face -->
  <circle cx="100" cy="100" r="97" fill="url(#pe-bg)" />
  <path d="M100 100 L100 18 A82 82 0 0 1 171 59 Z" fill="url(#pe-sweep)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="24s" repeatCount="indefinite" />
  </path>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#pe-ring)" stroke-width="5" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1" />
  <g stroke="#ffffff" stroke-linecap="round">
    <path d="M100 22 V14 M178 100 H186 M100 178 V186 M22 100 H14" stroke-width="3" stroke-opacity=".8" />
    <path d="M139 32.5 L142.5 26.4 M167.5 61 L173.6 57.5 M167.5 139 L173.6 142.5 M139 167.5 L142.5 173.6 M61 167.5 L57.5 173.6 M32.5 139 L26.4 142.5 M32.5 61 L26.4 57.5 M61 32.5 L57.5 26.4" stroke-width="2" stroke-opacity=".5" />
  </g>

  <!-- Sparkles -->
  <g fill="#ffe17a">
    <use href="#pe-spark" transform="translate(45 58) scale(.8)" />
    <use href="#pe-spark" transform="translate(158 84) scale(.6)" fill="#9fdcff" />
    <use href="#pe-spark" transform="translate(40 116) scale(.5)" fill="#9ff5c4" />
    <use href="#pe-spark" transform="translate(162 150) scale(.7)" />
  </g>

  <!-- The tree: branches not taken -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2.2" stroke-linecap="round">
    <path d="M100 52 Q80 66 66 90" />
    <path d="M66 90 Q52 108 46 132" />
    <path d="M66 90 Q78 110 84 132" />
    <path d="M134 90 Q148 108 154 132" />
  </g>
  <!-- The plan: forward from the start (blue), backward from the goal (coral), meeting in the middle -->
  <g fill="none" stroke-linecap="round" filter="url(#pe-glow)">
    <path d="M100 52 Q114 64 120 74" stroke="#5cc2ff" stroke-width="5" marker-end="url(#pe-fwd)" />
    <path d="M120 74 Q127 82 134 90" stroke="#5cc2ff" stroke-width="5" />
    <path d="M116 132 Q119 118 125 110" stroke="#ff7a7a" stroke-width="5" marker-end="url(#pe-bwd)" />
    <path d="M125 110 Q129 99 134 90" stroke="#ff7a7a" stroke-width="5" />
  </g>

  <!-- States -->
  <g stroke-width="2.4">
    <!-- the start: where one is now -->
    <circle cx="100" cy="52" r="15" fill="none" stroke="#5cc2ff" stroke-opacity=".5">
      <animate attributeName="r" values="11;19;11" dur="3s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values=".7;0;.7" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="52" r="10" fill="#ffffff" stroke="#5cc2ff" />
    <circle cx="100" cy="52" r="4" fill="#1e90ff" />
    <!-- a choice where planning can wait (dashed, paused) -->
    <circle cx="66" cy="90" r="10" fill="#1c2266" stroke="#9fdcff" stroke-dasharray="4 3" />
    <path d="M62.5 85.5 V94.5 M69.5 85.5 V94.5" stroke="#9fdcff" stroke-width="2.6" stroke-linecap="round" />
    <!-- where the forward and backward plans meet -->
    <circle cx="134" cy="90" r="11" fill="#3cf08c" stroke="#d9ffe9" filter="url(#pe-glow)" />
    <circle cx="46" cy="132" r="7" fill="#1c2266" stroke="#ffffff" stroke-opacity=".7" />
    <circle cx="84" cy="132" r="7" fill="#1c2266" stroke="#ffffff" stroke-opacity=".7" />
    <circle cx="154" cy="132" r="7" fill="#1c2266" stroke="#ffffff" stroke-opacity=".7" />
  </g>
  <!-- The goal -->
  <use href="#pe-star" transform="translate(116 133) scale(1.25)" fill="url(#pe-gold)" stroke="#fff4c2" stroke-width="1" filter="url(#pe-glow)" />

  <!-- Hourglass: the time saved by waiting -->
  <g transform="translate(100 161)">
    <path d="M-9 -12 H9 M-9 12 H9" stroke="#ffc94d" stroke-width="2.6" stroke-linecap="round" />
    <path d="M-7 -11 C-7 -4 -1.5 -2 -1.5 0 C-1.5 2 -7 4 -7 11 H7 C7 4 1.5 2 1.5 0 C1.5 -2 7 -4 7 -11 Z" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.4" />
    <path d="M-4.5 -6 C-3 -3 -1 -1.6 0 -0.5 C1 -1.6 3 -3 4.5 -6 Z" fill="#ffc94d" />
    <path d="M0 0 V9" stroke="#ffc94d" stroke-width="1.2" stroke-dasharray="1.5 1.5">
      <animate attributeName="stroke-dashoffset" values="0;-6" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M-6 10.5 C-4 6.5 -1.5 5 0 5 C1.5 5 4 6.5 6 10.5 Z" fill="#ffc94d" />
  </g>
</svg>
