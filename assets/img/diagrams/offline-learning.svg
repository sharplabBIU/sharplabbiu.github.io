<svg xmlns="http://www.w3.org/2000/svg" width="136" height="206" viewBox="0 0 136 206">
  <!-- Offline learning in the Dyna architecture, with the planning update from simulated experience; drawn for a white background -->
  <style>.eq { font-family: Georgia, "Times New Roman", serif; font-style: italic; } .txt { font-family: Georgia, "Times New Roman", serif; }</style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">

    <rect x="30" y="4" width="76" height="24" rx="6" fill="#ffffff" stroke="#00369f" stroke-width="1.6" />
    <rect x="2" y="104" width="58" height="24" rx="6" fill="#ffffff" stroke="#1f87a8" stroke-width="1.6" />
    <rect x="84" y="104" width="50" height="24" rx="6" fill="#ffffff" stroke="#d6455d" stroke-width="1.6" />
    <g class="txt" font-size="10" stroke="none" text-anchor="middle">
      <text x="68" y="20" fill="#00369f">value / policy</text>
      <text x="31" y="120" fill="#1f87a8">experience</text>
      <text x="109" y="120" fill="#d6455d">model</text>
    </g>
    <path stroke="#1f87a8" stroke-width="1.5" d="M34 28 C14 46 8 76 14 104 M15.7 97.5 L14 104 L9.8 98.8" />
    <path stroke="#00369f" stroke-width="1.5" d="M44 104 C46 80 52 50 56 28 M57.9 34.4 L56 28 L52 33.4" />
    <path stroke="#d6455d" stroke-width="1.5" d="M60 116 H84 M79 112.5 L84 116 L79 119.5" />
    <path stroke="#009f3e" stroke-width="2.4" d="M102 104 C104 80 98 50 86 28 M91.5 31.8 L86 28 L86.2 34.7" />
    <g class="eq" font-size="8.5" stroke="none">
      <text x="17" y="68" fill="#1f87a8">acting</text>
      <text x="53" y="82" fill="#00369f">direct RL</text>
      <text x="62" y="58" fill="#009f3e">planning</text>
      <text x="72" y="140" fill="#d6455d" text-anchor="middle">model learning</text>
    </g>
    <path stroke="#dce3f0" stroke-width="1" d="M18 151 H118" />
    <g class="eq" font-size="11" stroke="none" text-anchor="middle">
      <text x="68" y="168" fill="#d6455d">(r̂, ŝ′) ← Model(s,a)</text>
      <text x="68" y="185" fill="#009f3e">Q(s,a) ← Q(s,a) + α[ r̂</text>
      <text x="68" y="202" fill="#009f3e">+ γ maxₐ′ Q(ŝ′,a′) − Q(s,a) ]</text>
    </g>
  </g>
</svg>
