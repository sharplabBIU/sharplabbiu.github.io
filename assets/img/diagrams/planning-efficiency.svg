<svg xmlns="http://www.w3.org/2000/svg" width="136" height="150" viewBox="0 0 136 150">
  <!-- Planning: a decision tree with the planned route to the goal, and the Bellman optimality equation; drawn for a dark grey (#2b2f36) tile -->
  <style>.eq { font-family: Georgia, "Times New Roman", serif; font-style: italic; } .txt { font-family: Georgia, "Times New Roman", serif; }</style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <g transform="translate(-4 -10)">
      <path stroke="#4fd1e8" d="M72 18 L40 48 M72 18 L104 48 M40 48 L22 80 M40 48 L58 80 M104 48 L86 80 M104 48 L122 80" />
      <path stroke="#3ddc84" stroke-width="3" d="M72 18 L40 48 L22 80" />
      <circle cx="72" cy="18" r="5" fill="#3ddc84" stroke="#3ddc84" />
      <circle cx="40" cy="48" r="5" fill="#2b2f36" stroke="#3ddc84" />
      <circle cx="104" cy="48" r="5" fill="#2b2f36" stroke="#4fd1e8" />
      <rect x="18" y="80" width="8" height="8" fill="#ff6b81" stroke="#ff6b81" />
      <rect x="54" y="80" width="8" height="8" fill="#2b2f36" stroke="#4fd1e8" />
      <rect x="82" y="80" width="8" height="8" fill="#2b2f36" stroke="#4fd1e8" />
      <rect x="118" y="80" width="8" height="8" fill="#2b2f36" stroke="#4fd1e8" />
    </g>
    <g class="eq" font-size="11" stroke="none" text-anchor="middle">
      <text x="68" y="116" fill="#3ddc84">V*(s) = <tspan fill="#ff6b81">maxₐ</tspan> [ R(s,a)</text>
      <text x="68" y="134" fill="#3ddc84">+ γ Σₛ′ P(s′|s,a) V*(s′) ]</text>
    </g>
  </g>
</svg>
