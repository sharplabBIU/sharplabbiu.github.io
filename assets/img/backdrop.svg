<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
<!-- Page backdrop: reinforcement-learning equations in dark slate gray -->
<style>.t{font-family:Georgia,"Times New Roman",serif;font-style:italic}</style>
<g class="t" fill="#2f4f4f" opacity="0.22">
<text x="30" y="60" font-size="17">V(s) = maxₐ [ r(s,a) + γ Σ P(s′|s,a) V(s′) ]</text>
<text x="360" y="150" font-size="18">δ = r + γ V(s′) − V(s)</text>
<text x="40" y="225" font-size="18">Q(s,a) ← Q(s,a) + α δ</text>
<text x="300" y="300" font-size="17">π(a|s) ∝ exp(β Q(s,a))</text>
<text x="20" y="380" font-size="18">Vπ(s) = E[ Σₜ γᵗ rₜ₊₁ ]</text>
<text x="330" y="450" font-size="18">G = r + γ G′</text>
<text x="50" y="525" font-size="16">Q*(s,a) = r + γ Σ P(s′|s,a) maxₐ′ Q*(s′,a′)</text>
</g>
</svg>