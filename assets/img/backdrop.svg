<g class="t" fill="#2f4f4f">
<text x="250" y="62" font-size="16">V(s) = maxₐ [ r(s,a) + γ Σ P(s′|s,a) V(s′) ]</text>
<text x="28" y="250" font-size="17">δ = r + γ V(s′) − V(s)</text>
<text x="300" y="360" font-size="17">Q(s,a) ← Q(s,a) + α δ</text>
<text x="36" y="382" font-size="16">π(a|s) ∝ exp(β Q(s,a))</text>
<text x="290" y="560" font-size="17">Vπ(s) = E[ Σₜ γᵗ rₜ₊₁ ]</text>
<text x="30" y="575" font-size="17">G = r + γ G′</text>
</g>
</g>
