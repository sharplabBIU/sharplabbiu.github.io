<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Humans adaptively delay planning using cognitive maps: a folded map of the task (a cognitive map), with the route
       to the goal; at the junction marked with a clock, planning waits until it matters. The hourglass: time -->
  <defs>
    <linearGradient id="dp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6b6f" />
      <stop offset="1" stop-color="#28307e" />
    </linearGradient>
    <linearGradient id="dp-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe17a" />
      <stop offset="1" stop-color="#ffab2e" />
    </linearGradient>
    <filter id="dp-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".35" />
    </filter>
    <filter id="dp-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="dp-map">
      <path d="M36 34 L106 26 L176 34 L246 26 V152 L176 160 L106 152 L36 160 Z" />
    </clipPath>
    <path id="dp-star" d="M0 -11 L2.7 -3.72 L10.46 -3.4 L4.37 1.42 L6.47 8.9 L0 4.6 L-6.47 8.9 L-4.37 1.42 L-10.46 -3.4 L-2.7 -3.72 Z" />
    <path id="dp-pin" d="M0 0 C-2 -5 -7 -8 -7 -13 A7 7 0 0 1 7 -13 C7 -8 2 -5 0 0 Z" />
  </defs>
  <rect width="320" height="180" fill="url(#dp-bg)" />
  <g fill="#ffffff" opacity=".5">
    <circle cx="20" cy="20" r="1" /><circle cx="296" cy="164" r="1.2" /><circle cx="14" cy="150" r=".9" /><circle cx="262" cy="14" r="1" />
  </g>

  <!-- The folded map -->
  <g filter="url(#dp-shadow)">
    <path d="M36 34 L106 26 L176 34 L246 26 V152 L176 160 L106 152 L36 160 Z" fill="#eaf6ee" />
  </g>
  <g clip-path="url(#dp-map)">
    <path d="M106 26 L176 34 V160 L106 152 Z" fill="#000000" opacity=".06" />
    <path d="M176 34 L246 26 V152 L176 160 Z" fill="#000000" opacity=".02" />
    <!-- lake and park -->
    <path d="M150 112 C160 98 188 98 196 112 C204 126 186 140 168 136 C152 133 142 124 150 112 Z" fill="#8fd3ff" />
    <path d="M44 42 C64 36 84 44 84 58 C84 72 60 76 48 68 C38 62 34 48 44 42 Z" fill="#a9e6b8" />
    <path d="M200 40 C220 36 240 44 238 60 C236 74 214 72 206 64 C198 56 190 44 200 40 Z" fill="#a9e6b8" />
    <!-- streets: the cognitive map -->
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56 136 C76 120 86 104 108 96 C130 88 140 70 160 64 C180 58 196 76 222 82" />
      <path d="M108 96 C118 112 128 128 148 140" />
      <path d="M160 64 C150 48 136 42 120 38" />
      <path d="M56 136 C60 110 64 96 76 84" />
    </g>
    <g fill="none" stroke="#c6d6e2" stroke-width="1.4" stroke-linecap="round">
      <path d="M56 136 C76 120 86 104 108 96 C130 88 140 70 160 64 C180 58 196 76 222 82" />
      <path d="M108 96 C118 112 128 128 148 140" />
      <path d="M160 64 C150 48 136 42 120 38" />
      <path d="M56 136 C60 110 64 96 76 84" />
    </g>
    <!-- the route taken -->
    <path d="M56 136 C76 120 86 104 108 96 C130 88 140 70 160 64 C180 58 196 76 222 82" fill="none" stroke="#ff5f7e" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite" />
    </path>
  </g>
  <!-- fold creases -->
  <path d="M106 26 V152 M176 34 V160" stroke="#000000" stroke-opacity=".12" stroke-width="1" />

  <!-- Places on the map -->
  <circle cx="56" cy="136" r="7" fill="#1e90ff" stroke="#ffffff" stroke-width="2.4" />
  <use href="#dp-pin" transform="translate(120 41)" fill="#9b7bff" stroke="#ffffff" stroke-width="1.6" />
  <use href="#dp-pin" transform="translate(148 143)" fill="#2dd4bf" stroke="#ffffff" stroke-width="1.6" />
  <use href="#dp-pin" transform="translate(76 87)" fill="#ff9a5c" stroke="#ffffff" stroke-width="1.6" />
  <!-- the junction where planning waits: a clock -->
  <g transform="translate(160 64)">
    <circle r="10" fill="#ffffff" stroke="#28307e" stroke-width="2.4" />
    <path d="M0 -6 V0 L4.5 2.5" fill="none" stroke="#28307e" stroke-width="2.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </path>
  </g>
  <circle cx="108" cy="96" r="5.5" fill="#ffffff" stroke="#ff5f7e" stroke-width="2.4" />
  <!-- the goal -->
  <use href="#dp-star" transform="translate(224 80) scale(1.35)" fill="#ffc94d" stroke="#b86b00" stroke-width=".8" filter="url(#dp-glow)" />

  <!-- The hourglass -->
  <g transform="translate(284 92)">
    <path d="M-17 -54 H17 M-17 54 H17" stroke="#ffc94d" stroke-width="5" stroke-linecap="round" />
    <path d="M-14 -52 V52 M14 -52 V52" stroke="#ffc94d" stroke-opacity=".55" stroke-width="2.4" />
    <path d="M-11 -50 C-11 -20 -3 -10 -3 0 C-3 10 -11 20 -11 50 H11 C11 20 3 10 3 0 C3 -10 11 -20 11 -50 Z" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.6" />
    <path d="M-8 -26 C-6 -14 -2 -6 0 -2 C2 -6 6 -14 8 -26 Z" fill="url(#dp-sand)" />
    <path d="M0 0 V44" stroke="#ffc94d" stroke-width="1.6" stroke-dasharray="2 2">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M-10 49 C-7 38 -3 33 0 33 C3 33 7 38 10 49 Z" fill="url(#dp-sand)" />
  </g>
</svg>
