<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Safety and efficacy of modular digital psychotherapy for social anxiety: a phone with therapy modules and a chat
       on it, people gathering on the left (social situations), and on the right a shield (safety) and symptoms falling
       over the weeks (efficacy) -->
  <defs>
    <linearGradient id="dt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d7f6c" />
      <stop offset="1" stop-color="#1c4fa0" />
    </linearGradient>
    <linearGradient id="dt-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9ff" />
      <stop offset="1" stop-color="#dcebff" />
    </linearGradient>
    <linearGradient id="dt-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5df0a4" />
      <stop offset="1" stop-color="#18a865" />
    </linearGradient>
    <filter id="dt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity=".35" />
    </filter>
    <filter id="dt-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <path id="dt-heart" d="M0 4 C-6 -1 -8 -4 -8 -6.5 C-8 -9.5 -4 -11 0 -7.5 C4 -11 8 -9.5 8 -6.5 C8 -4 6 -1 0 4 Z" />
  </defs>
  <rect width="320" height="180" fill="url(#dt-bg)" />
  <g fill="#ffffff" opacity=".45"><circle cx="150" cy="10" r="1" /><circle cx="18" cy="160" r="1.2" /><circle cx="306" cy="18" r="1" /></g>

  <!-- People: social situations -->
  <g transform="translate(62 118)">
    <circle cx="-26" cy="-26" r="11" fill="#ffc94d" />
    <path d="M-44 14 C-44 -6 -36 -12 -26 -12 C-16 -12 -8 -6 -8 14 Z" fill="#ffc94d" />
    <circle cx="26" cy="-26" r="11" fill="#b48cff" />
    <path d="M8 14 C8 -6 16 -12 26 -12 C36 -12 44 -6 44 14 Z" fill="#b48cff" />
    <circle cx="0" cy="-34" r="13" fill="#ff8a8a" stroke="#0d6a63" stroke-width="2" />
    <path d="M-21 18 C-21 -4 -12 -16 0 -16 C12 -16 21 -4 21 18 Z" fill="#ff8a8a" stroke="#0d6a63" stroke-width="2" />
    <!-- speech -->
    <path d="M-50 -78 H-14 A6 6 0 0 1 -8 -72 V-60 A6 6 0 0 1 -14 -54 H-30 L-38 -46 V-54 H-50 A6 6 0 0 1 -56 -60 V-72 A6 6 0 0 1 -50 -78 Z" fill="#ffffff" />
    <g fill="#1c4fa0"><circle cx="-41" cy="-66" r="2" /><circle cx="-32" cy="-66" r="2" /><circle cx="-23" cy="-66" r="2" /></g>
  </g>

  <!-- The phone -->
  <g transform="translate(124 16)" filter="url(#dt-shadow)">
    <rect width="76" height="150" rx="13" fill="#1a2033" />
    <rect x="5" y="9" width="66" height="132" rx="8" fill="url(#dt-screen)" />
    <rect x="28" y="4" width="20" height="3" rx="1.5" fill="#3a4258" />
  </g>
  <g transform="translate(129 25)">
    <!-- modules, with progress -->
    <rect x="5" y="6" width="56" height="18" rx="5" fill="#ffffff" stroke="#bcd3f2" />
    <circle cx="14" cy="15" r="5" fill="#2dd4bf" />
    <rect x="22" y="11" width="32" height="3" rx="1.5" fill="#9fb3cf" />
    <rect x="22" y="17" width="32" height="3" rx="1.5" fill="#e3ebf7" /><rect x="22" y="17" width="28" height="3" rx="1.5" fill="#2dd4bf" />
    <rect x="5" y="28" width="56" height="18" rx="5" fill="#ffffff" stroke="#bcd3f2" />
    <circle cx="14" cy="37" r="5" fill="#9b7bff" />
    <rect x="22" y="33" width="32" height="3" rx="1.5" fill="#9fb3cf" />
    <rect x="22" y="39" width="32" height="3" rx="1.5" fill="#e3ebf7" /><rect x="22" y="39" width="18" height="3" rx="1.5" fill="#9b7bff" />
    <rect x="5" y="50" width="56" height="18" rx="5" fill="#ffffff" stroke="#bcd3f2" />
    <circle cx="14" cy="59" r="5" fill="#ff9a5c" />
    <rect x="22" y="55" width="32" height="3" rx="1.5" fill="#9fb3cf" />
    <rect x="22" y="61" width="32" height="3" rx="1.5" fill="#e3ebf7" /><rect x="22" y="61" width="8" height="3" rx="1.5" fill="#ff9a5c" />
    <!-- the chat -->
    <rect x="5" y="76" width="38" height="14" rx="7" fill="#d5e3f7" />
    <rect x="11" y="81" width="24" height="3" rx="1.5" fill="#8aa1c2" />
    <rect x="23" y="94" width="38" height="14" rx="7" fill="#1e90ff" />
    <rect x="29" y="99" width="24" height="3" rx="1.5" fill="#ffffff" />
    <rect x="5" y="112" width="30" height="14" rx="7" fill="#d5e3f7" />
    <g fill="#8aa1c2">
      <circle cx="13" cy="119" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite" /></circle>
      <circle cx="20" cy="119" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite" /></circle>
      <circle cx="27" cy="119" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" begin=".4s" repeatCount="indefinite" /></circle>
    </g>
  </g>
  <use href="#dt-heart" transform="translate(212 30) scale(1.1)" fill="#ff7a9a" filter="url(#dt-glow)" />
  <use href="#dt-heart" transform="translate(112 26) scale(.7)" fill="#ffc94d" />

  <!-- Safety -->
  <g transform="translate(250 54)" filter="url(#dt-glow)">
    <path d="M0 -30 L24 -20 V-2 C24 14 13 24 0 30 C-13 24 -24 14 -24 -2 V-20 Z" fill="url(#dt-shield)" stroke="#e6fff0" stroke-width="2" />
    <path d="M-10 0 L-3 8 L11 -8" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Efficacy: symptoms falling over the weeks -->
  <g transform="translate(220 104)">
    <path d="M0 0 V56 H76" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round" />
    <rect x="8" y="10" width="10" height="46" rx="2" fill="#ff8a8a" />
    <rect x="24" y="20" width="10" height="36" rx="2" fill="#ffb07a" />
    <rect x="40" y="30" width="10" height="26" rx="2" fill="#ffd36e" />
    <rect x="56" y="40" width="10" height="16" rx="2" fill="#5df0a4" />
    <path d="M10 4 C28 10 46 22 70 34" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" />
  </g>
</svg>
