<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Unravelling repetitive negative thinking with reinforcement learning: a head in profile with a loop of negative
       thoughts going round inside it, and from it, a thought cloud with a spiral, raining -->
  <defs>
    <linearGradient id="rt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a55" />
      <stop offset="1" stop-color="#55306f" />
    </linearGradient>
    <linearGradient id="rt-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb8ff" stop-opacity=".28" />
      <stop offset="1" stop-color="#ff7ab8" stop-opacity=".2" />
    </linearGradient>
    <linearGradient id="rt-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff" />
      <stop offset="1" stop-color="#ff8fc8" />
    </linearGradient>
    <linearGradient id="rt-spiral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a7a" />
      <stop offset="1" stop-color="#b48cff" />
    </linearGradient>
    <filter id="rt-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="rt-head-a" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#ffd0e6" />
    </marker>
  </defs>
  <rect width="320" height="180" fill="url(#rt-bg)" />
  <g fill="#ffffff" opacity=".5"><circle cx="24" cy="22" r="1" /><circle cx="300" cy="160" r="1.2" /><circle cx="240" cy="168" r=".9" /></g>

  <!-- The head -->
  <path d="M70 176 C70 154 62 144 58 124 C50 94 55 54 85 38 C115 22 165 30 178 66 C183 80 182 88 186 96 L196 112 C198 116 194 118 189 119 C191 124 190 128 187 130 C189 134 187 138 183 140 C182 150 172 154 160 154 C150 155 146 160 146 176 Z" fill="url(#rt-head)" stroke="url(#rt-edge)" stroke-width="2.4" stroke-linejoin="round" filter="url(#rt-glow)" />

  <!-- The loop of thoughts going round -->
  <g transform="translate(116 92)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
      <path d="M-6 -33 A34 34 0 0 1 31 -11" fill="none" stroke="#ffd0e6" stroke-width="2.6" stroke-linecap="round" marker-end="url(#rt-head-a)" />
      <path d="M30 14 A34 34 0 0 1 -6 33" fill="none" stroke="#ffd0e6" stroke-width="2.6" stroke-linecap="round" marker-end="url(#rt-head-a)" />
      <path d="M-28 19 A34 34 0 0 1 -26 -22" fill="none" stroke="#ffd0e6" stroke-width="2.6" stroke-linecap="round" marker-end="url(#rt-head-a)" />
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
      <circle cx="0" cy="-34" r="10" fill="#ff7a7a" stroke="#ffffff" stroke-width="1.6" />
      <text x="0" y="-29.5" font-size="15" fill="#ffffff">−</text>
      <circle cx="29" cy="17" r="10" fill="#b48cff" stroke="#ffffff" stroke-width="1.6" />
      <text x="29" y="21.5" font-size="15" fill="#ffffff">−</text>
      <circle cx="-29" cy="17" r="10" fill="#ff9a5c" stroke="#ffffff" stroke-width="1.6" />
      <text x="-29" y="21.5" font-size="15" fill="#ffffff">−</text>
    </g>
    <!-- a raincloud in the middle -->
    <path d="M-12 2 C-15 -5 -7 -10 -2 -7 C0 -13 10 -13 11 -6 C16 -7 18 0 13 2 Z" fill="#c9d6ff" />
    <g stroke="#7fd0ff" stroke-width="1.6" stroke-linecap="round">
      <path d="M-6 6 L-8 11"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite" /></path>
      <path d="M1 6 L-1 11"><animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite" /></path>
      <path d="M8 6 L6 11"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite" /></path>
    </g>
  </g>

  <!-- Thoughts rising to a cloud -->
  <circle cx="204" cy="86" r="4" fill="#ffffff" opacity=".7" />
  <circle cx="216" cy="72" r="6" fill="#ffffff" opacity=".8" />
  <path d="M222 58 C214 50 222 36 236 40 C240 26 262 22 272 34 C286 28 302 40 296 54 C306 62 298 78 284 76 C278 86 258 88 250 78 C238 84 222 76 224 66 C216 64 216 58 222 58 Z" fill="#ffffff" fill-opacity=".92" />
  <path d="M262 57 C262 53 268 53 268 58 C268 64 258 65 256 58 C254 50 266 46 271 52 C277 59 272 70 262 70 C250 70 246 58 250 50 C255 41 270 39 278 46" fill="none" stroke="url(#rt-spiral)" stroke-width="3" stroke-linecap="round" />
  <!-- rain from it -->
  <g stroke="#7fd0ff" stroke-width="2" stroke-linecap="round">
    <path d="M244 96 L240 106"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite" /></path>
    <path d="M258 98 L254 108"><animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite" /></path>
    <path d="M272 96 L268 106"><animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite" /></path>
    <path d="M286 94 L282 104"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite" /></path>
    <path d="M250 116 L246 126"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite" /></path>
    <path d="M266 118 L262 128"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite" /></path>
    <path d="M280 116 L276 126"><animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite" /></path>
  </g>
  <!-- the values that keep falling -->
  <g transform="translate(232 140)">
    <path d="M0 24 H64" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.2" />
    <rect x="4" y="6" width="9" height="18" rx="2" fill="#ff7a7a" />
    <rect x="19" y="10" width="9" height="14" rx="2" fill="#ff9a5c" />
    <rect x="34" y="14" width="9" height="10" rx="2" fill="#b48cff" />
    <rect x="49" y="17" width="9" height="7" rx="2" fill="#7fd0ff" />
  </g>
</svg>
