<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Anxiety is associated with biases in task generalization: an action learned under threat in one task (left: the
       storm, and the safe route) is carried over less to a similar task (right: the route fades and breaks on the way
       across). Below, generalization gradients: broad (dashed) and narrow (coral), as with worry -->
  <defs>
    <linearGradient id="tg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2380" />
      <stop offset="1" stop-color="#b8357a" />
    </linearGradient>
    <linearGradient id="tg-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07" />
    </linearGradient>
    <linearGradient id="tg-carry" x1="128" y1="0" x2="192" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cf08c" />
      <stop offset=".55" stop-color="#3cf08c" stop-opacity=".55" />
      <stop offset="1" stop-color="#3cf08c" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tg-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8" />
      <stop offset="1" stop-color="#ffab2e" />
    </linearGradient>
    <filter id="tg-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="tg-head" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#3cf08c" fill-opacity=".35" />
    </marker>
  </defs>
  <rect width="320" height="180" fill="url(#tg-bg)" />
  <g fill="#ffffff" opacity=".45"><circle cx="160" cy="16" r="1.2" /><circle cx="300" cy="22" r="1" /><circle cx="16" cy="28" r="1" /></g>

  <!-- The task learned under threat -->
  <g transform="translate(26 38)">
    <rect width="96" height="96" rx="10" fill="url(#tg-card)" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.6" />
    <path d="M24 0 V96 M48 0 V96 M72 0 V96 M0 24 H96 M0 48 H96 M0 72 H96" stroke="#ffffff" stroke-opacity=".22" />
    <rect x="49" y="49" width="22" height="22" rx="4" fill="#ff7a7a" fill-opacity=".85" />
    <path d="M12 84 V36 H84 V12" fill="none" stroke="#3cf08c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#tg-glow)" />
    <circle cx="12" cy="84" r="6" fill="#ffffff" stroke="#3cf08c" stroke-width="2.4" />
    <path d="M78 6 H90 V18 H78 Z" fill="#3cf08c" opacity=".35" />
    <path d="M84 4 L91 8 V14 C91 18 88 21 84 23 C80 21 77 18 77 14 V8 Z" fill="#3cf08c" stroke="#e6fff0" stroke-width="1.2" />
  </g>
  <!-- the storm over it -->
  <g transform="translate(74 30)">
    <path d="M-30 4 C-34 -8 -20 -16 -12 -10 C-8 -22 12 -22 16 -10 C26 -14 34 -4 28 4 Z" fill="#3a2d5c" stroke="#d9c6ff" stroke-width="1.4" />
    <path d="M2 2 L-6 16 H1 L-4 28 L10 10 H3 L8 2 Z" fill="url(#tg-bolt)" stroke="#fff4c2" stroke-width=".8" filter="url(#tg-glow)">
      <animate attributeName="opacity" values="1;1;.3;1;1" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- A similar task: the same route, barely carried over -->
  <g transform="translate(198 38)">
    <rect width="96" height="96" rx="10" fill="url(#tg-card)" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.6" />
    <path d="M24 0 V96 M48 0 V96 M72 0 V96 M0 24 H96 M0 48 H96 M0 72 H96" stroke="#ffffff" stroke-opacity=".22" />
    <rect x="25" y="49" width="22" height="22" rx="4" fill="#ffc94d" fill-opacity=".8" />
    <path d="M12 84 V60 M12 36 H36 M60 36 H84 V12" fill="none" stroke="#3cf08c" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="round" />
    <circle cx="12" cy="84" r="6" fill="#ffffff" stroke="#3cf08c" stroke-width="2.4" stroke-opacity=".6" />
    <text x="66" y="70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" opacity=".9">?</text>
  </g>

  <!-- Carried across: fading, and breaking up on the way -->
  <path d="M128 64 C146 38 174 38 192 60" fill="none" stroke="url(#tg-carry)" stroke-width="4" stroke-linecap="round" stroke-dasharray="16 5 9 6 4 8" marker-end="url(#tg-head)" />

  <!-- Generalization gradients -->
  <g transform="translate(26 146)">
    <path d="M0 26 H268" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.2" />
    <path d="M0 24 C18 24 30 2 48 2 C66 2 78 24 96 24" fill="none" stroke="#ff8f8f" stroke-width="3" stroke-linecap="round" filter="url(#tg-glow)" />
    <path d="M0 24 C30 22 34 2 48 2 C80 2 140 10 200 20 C230 24 250 25 268 25" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />
    <circle cx="48" cy="2" r="3.2" fill="#ffffff" />
    <path d="M220 20 V30" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.6" />
  </g>
</svg>
